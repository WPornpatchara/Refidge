publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
 
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  flutter_timezone: ^3.0.0
  cupertino_icons: ^1.0.8

  # 📷 Camera
  camera: ^0.11.0+2

  # 🔍 OCR (ML Kit)
  google_mlkit_text_recognition: ^0.15.0

  http: ^1.2.0

  url_launcher: ^6.3.0

  shared_preferences: ^2.2.3
